name: test

on:
  pull_request:
  push:
    branches: [main]

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  pytest:
    uses: nmichlo/.github/.github/workflows/pytest.yaml@main
    with:
      # 3.14 is excluded: hydra-core is pinned <1.4 and its argparse use breaks on
      # 3.14 with "TypeError: argument of type 'LazyCompletionHelp' is not a
      # container or iterable". Restore once hydra supports 3.14.
      python-versions: '["3.12", "3.13"]'
      install-extras: "test"
      pytest-args: "--color=yes --verbose"
      coverage: "disent"
    secrets:
      # named rather than `secrets: inherit`, which hands the called workflow
      # every secret this repo has, including ones it has no business seeing.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The branch-protection gate; see nmichlo/.github/actions/gate for why it
  # exists. `always()` is required, or the gate is skipped when what it guards
  # fails -- and a skipped required check counts as success.
  test:
    needs: [pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: nmichlo/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
