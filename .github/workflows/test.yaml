name: test

on:
  pull_request:
  push:
    branches: [main]

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  pytest:
    uses: nmichlo/.github/.github/workflows/pytest.yaml@main
    with:
      # 3.14 is excluded: hydra-core is pinned <1.4 and its argparse use breaks on
      # 3.14 with "TypeError: argument of type 'LazyCompletionHelp' is not a
      # container or iterable". Restore once hydra supports 3.14.
      python-versions: '["3.12", "3.13"]'
      install-extras: "test"
      pytest-args: "--color=yes --verbose"
      coverage: "disent"
    secrets:
      # named rather than `secrets: inherit`, which hands the called workflow
      # every secret this repo has, including ones it has no business seeing.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The branch-protection gate. A required status check is matched by name, and
  # every name the jobs above produce is unstable: a reusable job is called
  # "<caller-job> / <callee-job>" and a matrix job is called "job (3.12)", so
  # renaming a job or changing a matrix silently stops the required check from
  # reporting -- and every PR then waits on it forever. This job is plain, so
  # its check is always exactly "test".
  test:
    needs: [pytest]
    # always(), or the gate is skipped when what it guards fails -- and a
    # skipped required check counts as success.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` counts as failure too: a job that did not run has not passed,
      # and a gate that lets it through is worse than no gate. Actions prints
      # `env:` into the run group, so the log shows which it was.
      - name: Check results
        env:
          FAILED: >-
            ${{ contains(needs.*.result, 'failure')
             || contains(needs.*.result, 'cancelled')
             || contains(needs.*.result, 'skipped') }}
        run: '[ "${FAILED}" = "false" ]'
