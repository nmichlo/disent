name: release

# both triggers are required: a tag pushed with GITHUB_TOKEN does not start
# another workflow, so the bump and the release have to live in one run.
on:
  pull_request: {types: [closed], branches: [main]}
  push: {tags: ['v*.*.*']}

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  release:
    # a reusable workflow cannot hold more permission than its caller, and this
    # one pushes tags and creates releases.
    permissions:
      contents: write
    uses: nmichlo/.github/.github/workflows/release.yaml@main
    secrets:
      # named rather than `secrets: inherit`, which hands the called workflow
      # every secret this repo has, including ones it has no business seeing.
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
