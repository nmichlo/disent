# runs `.pre-commit-config.yaml` verbatim, so `pre-commit run --all-files`
# locally and CI can never disagree. tool config lives in `pyproject.toml`.

name: lint

on:
  pull_request:
  push:
    branches: [main]

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  pre-commit:
    uses: nmichlo/.github/.github/workflows/pre-commit.yaml@main
    with:
      # `[test]` not `[extra]`: ty checks `tests/` too, which imports pytest
      install-extras: "test"

  # The branch-protection gate; see nmichlo/.github/actions/gate for why it
  # exists. `always()` is required, or the gate is skipped when what it guards
  # fails -- and a skipped required check counts as success.
  lint:
    needs: [pre-commit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: nmichlo/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
