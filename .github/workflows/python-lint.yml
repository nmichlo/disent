# this runs `.pre-commit-config.yaml` verbatim, so `pre-commit run --all-files`
# locally and CI can never disagree. tool config lives in `pyproject.toml`.

name: lint

on: [pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `ty` needs the project dependencies resolvable to check anything useful.
      # it auto-detects `.venv`, so install into one before running the hooks.
      # use `[test]` not `[extra]`: ty checks `tests/` too, which imports pytest.
      # `[test]` depends on `disent[extra]`, so it is a superset.
      - name: Install project into .venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[test]"

      - name: Run pre-commit
        run: uvx --from pre-commit pre-commit run --all-files --show-diff-on-failure
