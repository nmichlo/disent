# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

# Optionally build your docs in additional formats such as PDF
formats: all

# docs dependencies are declared in `pyproject.toml` under `[project.optional-dependencies]`
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
