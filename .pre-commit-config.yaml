# tool config lives in `pyproject.toml` (the `[tool.ruff]` and `[tool.ty]` sections).
# CI runs this file verbatim, see `.github/workflows/python-lint.yml`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - { id: check-added-large-files, args: ["--maxkb=300"] }
      - { id: check-case-conflict }
      - { id: detect-private-key }
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
      # `uv.lock` is committed, so it has to stay in step with `pyproject.toml`
      - id: uv-lock

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.79
    hooks:
      # `ty` needs the project dependencies resolvable. it auto-detects `.venv`, so
      # create one first: `uv venv --python 3.12 && uv pip install -e ".[test]"`.
      # `[test]` not `[extra]`: ty checks `tests/` too, which imports pytest.
      - id: ty
